<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Teleskop Bulan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="telescope-container">
        <div class="viewfinder">
            <div class="moon-stage" id="moonStage">
                <!-- Ganti nama file sesuai foto Anda -->
                <img src="moon.jfif" alt="Bulan" class="moon">
                <img src="my girl 2.jpeg" alt="my girl" class="moon-face" id="moonFace">
            </div>
            <div class="lens-flare"></div>
        </div>
    </div>

    <div class="controls">
        <label for="zoomSlider"><b>Cobak Zoom</b></label><br>
        <input type="range" id="zoomSlider" min="1" max="8" step="0.05" value="1">
    </div>

    <script src="script.js"></script>
</body>
</html>
